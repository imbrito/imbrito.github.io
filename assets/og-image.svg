<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="Ismael Moreira de Brito — Data &amp; AI Engineer. Mercado Livre, Globo.com, B2W Digital. Rio de Janeiro, Brasil.">
  <title>Ismael Moreira de Brito — Data &amp; AI Engineer</title>
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.72">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#4f46e5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.92" r="0.55">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#020617"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="5" fill="url(#topbar)"/>

  <!-- marca -->
  <g transform="translate(72 68)">
    <rect width="54" height="54" rx="12" fill="#4f46e5"/>
    <g fill="#ffffff" transform="scale(1.6875)">
      <rect x="5.6" y="11.3" width="20.8" height="3.2" rx="1.3"/>
      <rect x="5.6" y="17.5" width="20.8" height="3.2" rx="1.3"/>
      <g transform="translate(2.25 0) skewX(-8)">
        <rect x="9.9" y="5.6" width="3.2" height="20.8" rx="1.3"/>
        <rect x="18.5" y="5.6" width="3.2" height="20.8" rx="1.3"/>
      </g>
    </g>
    <text x="74" y="35" font-family="'Fira Code', ui-monospace, monospace" font-size="24"
          font-weight="700" letter-spacing="1" fill="#ffffff">IMBRITO</text>
  </g>

  <!-- nome -->
  <text x="72" y="318" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800"
        letter-spacing="-2.5" fill="#ffffff">Ismael Moreira de Brito</text>

  <!-- cargo -->
  <text x="72" y="374" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600"
        letter-spacing="-0.4" fill="#a5b4fc">Data &amp; AI Engineer · Analytics Engineer · Arquiteto de Dados</text>

  <line x1="72" y1="440" x2="1128" y2="440" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- empresas -->
  <text x="72" y="492" font-family="'Fira Code', ui-monospace, monospace" font-size="21" font-weight="500"
        letter-spacing="2.5" fill="#94a3b8">MERCADO LIVRE · GLOBO.COM · B2W DIGITAL</text>

  <!-- rodapé -->
  <text x="72" y="562" font-family="'Fira Code', ui-monospace, monospace" font-size="23" font-weight="700"
